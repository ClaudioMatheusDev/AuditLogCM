name: Publish AuditLogCM to NuGet

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build AuditLogCM.sln --configuration Release

      - name: Pack
        run: dotnet pack AuditLogCM.sln --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.API_KEY_NUGET }} --source https://api.nuget.org/v3/index.json --skip-duplicate
